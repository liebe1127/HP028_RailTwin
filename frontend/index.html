<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>레일 변형 예측 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes flash {
      0%   { background-color: rgba(99, 102, 241, 0.25); }
      100% { background-color: transparent; }
    }
    .flash { animation: flash 0.4s ease-out; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .pulse { animation: pulse-dot 1.4s ease-in-out infinite; }

    body { background: #0f172a; }
  </style>
</head>
<body class="min-h-screen text-slate-100 font-mono p-6">

  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white">
        레일 변형 예측 대시보드
      </h1>
      <p class="text-slate-400 text-sm mt-1">
        갠트리 크레인 · 하부 주행 레일(단차·침하·뒤틀림) · ESP32-S3
      </p>
    </div>

    <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-800 border border-slate-700">
      <span id="dot" class="w-3 h-3 rounded-full bg-red-500 pulse"></span>
      <span id="status-text" class="text-sm font-semibold text-red-400">Disconnected</span>
    </div>
  </header>

  <!-- 예측 / 위치 핵심 지표 -->
  <section class="grid grid-cols-1 gap-4 mb-4 md:grid-cols-3">
    <div class="rounded-2xl bg-slate-800 border border-amber-700/50 p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-widest text-amber-400">레일 변형 예측</span>
        <span class="text-xs text-slate-500">PRED_RAIL_DEFORM</span>
      </div>
      <div id="val-pred" class="text-4xl font-bold text-white tabular-nums rounded-lg px-1">—</div>
      <div class="h-1 rounded-full bg-slate-700 overflow-hidden">
        <div id="bar-pred" class="h-full bg-amber-500 rounded-full transition-all duration-300" style="width:0%"></div>
      </div>
    </div>

    <div class="rounded-2xl bg-slate-800 border border-rose-700/50 p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-widest text-rose-400">파고율 (단차 충격)</span>
        <span class="text-xs text-slate-500">CREST</span>
      </div>
      <div id="val-crest" class="text-4xl font-bold text-white tabular-nums rounded-lg px-1">—</div>
      <div class="h-1 rounded-full bg-slate-700 overflow-hidden">
        <div id="bar-crest" class="h-full bg-rose-500 rounded-full transition-all duration-300" style="width:0%"></div>
      </div>
    </div>

    <div class="rounded-2xl bg-slate-800 border border-emerald-700/50 p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-widest text-emerald-400">크레인 위치</span>
        <span class="text-xs text-slate-500">distance_x / cm</span>
      </div>
      <div id="val-x" class="text-4xl font-bold text-white tabular-nums rounded-lg px-1">—</div>
      <div class="h-1 rounded-full bg-slate-700 overflow-hidden">
        <div id="bar-x" class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width:0%"></div>
      </div>
    </div>
  </section>

  <!-- 센서 원시값 -->
  <main class="grid grid-cols-2 gap-4 md:grid-cols-4">
    <div class="rounded-2xl bg-slate-800 border border-slate-700 p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-widest text-indigo-400">AAX</span>
        <span class="text-xs text-slate-500">m/s²</span>
      </div>
      <div id="val-aax" class="text-3xl font-bold text-white tabular-nums rounded-lg px-1">—</div>
    </div>
    <div class="rounded-2xl bg-slate-800 border border-slate-700 p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-widest text-violet-400">AAY</span>
        <span class="text-xs text-slate-500">m/s²</span>
      </div>
      <div id="val-aay" class="text-3xl font-bold text-white tabular-nums rounded-lg px-1">—</div>
    </div>
    <div class="rounded-2xl bg-slate-800 border border-slate-700 p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-widest text-sky-400">AAZ</span>
        <span class="text-xs text-slate-500">m/s²</span>
      </div>
      <div id="val-aaz" class="text-3xl font-bold text-white tabular-nums rounded-lg px-1">—</div>
    </div>
    <div class="rounded-2xl bg-slate-800 border border-slate-700 p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-widest text-teal-400">DIST</span>
        <span class="text-xs text-slate-500">cm</span>
      </div>
      <div id="val-dist" class="text-3xl font-bold text-white tabular-nums rounded-lg px-1">—</div>
    </div>
  </main>

  <footer class="mt-6 flex items-center justify-between text-xs text-slate-500">
    <span id="ws-url-label">wss://hp028-railtwin.duckdns.org/ws</span>
    <span id="last-updated">마지막 수신: —</span>
    <span id="msg-count">수신 횟수: 0</span>
  </footer>

  <script>
    // 클라우드 HTTPS: wss://…  |  로컬: ?ws=ws://127.0.0.1:8000/ws
    const WS_URL = new URLSearchParams(location.search).get('ws')
      || 'wss://hp028-railtwin.duckdns.org/ws';
    document.getElementById('ws-url-label').textContent = WS_URL;
    const RECONNECT_MS = 4000;
    const PRED_MAX = 40;
    const CREST_MAX = 10;
    const X_MAX = 100;

    let ws = null;
    let reconnectTimer = null;
    let msgCount = 0;

    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const lastUpdated = document.getElementById('last-updated');
    const msgCountEl = document.getElementById('msg-count');

    function setConnected(connected) {
      if (connected) {
        dot.className = 'w-3 h-3 rounded-full bg-emerald-400 pulse';
        statusText.textContent = 'Connected';
        statusText.className = 'text-sm font-semibold text-emerald-400';
      } else {
        dot.className = 'w-3 h-3 rounded-full bg-red-500 pulse';
        statusText.textContent = 'Disconnected';
        statusText.className = 'text-sm font-semibold text-red-400';
      }
    }

    function flashEl(el) {
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    }

    function setText(id, value, digits = 2) {
      const el = document.getElementById(id);
      if (value === null || value === undefined) {
        el.textContent = '—';
      } else {
        el.textContent = Number(value).toFixed(digits);
      }
      flashEl(el);
    }

    function setBar(id, value, max) {
      const el = document.getElementById(id);
      if (value === null || value === undefined) return;
      const pct = Math.min(100, Math.max(0, (Number(value) / max) * 100));
      el.style.width = pct + '%';
    }

    function connect() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        setConnected(true);
        console.log('[WS] 연결됨:', WS_URL);
      };

      ws.onmessage = (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          console.warn('[WS] JSON 파싱 실패:', event.data);
          return;
        }

        const x = data.distance_x ?? data.DIST;
        setText('val-pred', data.PRED_RAIL_DEFORM);
        setBar('bar-pred', data.PRED_RAIL_DEFORM, PRED_MAX);
        setText('val-crest', data.CREST);
        setBar('bar-crest', data.CREST, CREST_MAX);
        setText('val-x', x, 0);
        setBar('bar-x', x, X_MAX);

        setText('val-aax', data.AAX);
        setText('val-aay', data.AAY);
        setText('val-aaz', data.AAZ);
        setText('val-dist', data.DIST);

        msgCount++;
        lastUpdated.textContent = `마지막 수신: ${new Date().toLocaleTimeString('ko-KR')}`;
        msgCountEl.textContent = `수신 횟수: ${msgCount.toLocaleString()}`;
      };

      ws.onclose = (event) => {
        setConnected(false);
        console.warn(`[WS] 연결 종료 (code=${event.code}) — ${RECONNECT_MS / 1000}초 후 재연결`);
        reconnectTimer = setTimeout(connect, RECONNECT_MS);
      };

      ws.onerror = () => ws.close();
    }

    connect();
  </script>

</body>
</html>
