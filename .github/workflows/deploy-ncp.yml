# main에 merge/push 되면 NCP 서버에서 git pull + fastapi 재시작
name: Deploy to NCP

on:
  push:
    branches: [main]
    # 연구 폴더만 바뀐 push 는 서버에 배포하지 않는다 (FastAPI 재시작으로 3회 평균 기록이 지워지지 않게).
    # 서버 코드와 함께 바뀐 push 는 그대로 배포된다.
    paths-ignore:
      - "research/**"
  workflow_dispatch:

concurrency:
  group: deploy-ncp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (git pull + restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USER }}
          key: ${{ secrets.NCP_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/HP028_RailTwin
            INSTALL_GRAFANA=0 bash scripts/ncp_deploy.sh
