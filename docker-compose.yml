# RailTwin FastAPI + Mosquitto + 화면 WebSocket (로컬 Docker)
# 사용: docker compose up -d --build
# 접속: https://223.130.128.198:8000/dashboard  ·  wss://223.130.128.198:8000/ws
# MQTT: mqtt://223.130.128.198:1883

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: railtwin-mqtt
    ports:
      - "1883:1883"
    environment:
      MQTT_TLS: "false"
      MQTT_LEFT_PASSWORD: ${MQTT_LEFT_PASSWORD:-replace-with-left-node-password}
      MQTT_RIGHT_PASSWORD: ${MQTT_RIGHT_PASSWORD:-replace-with-right-node-password}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-replace-with-backend-password}
    volumes:
      - ./deploy/mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    command: ["/bin/sh", "/mosquitto/config/start.sh"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u railtwin-backend -P \"$$MQTT_BACKEND_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 5",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  railtwin:
    build: .
    container_name: railtwin-api
    ports:
      - "8000:8000"
    # .env 가 있으면 사용 (없어도 기동됨). 생성: cp .env.example .env
    env_file:
      - path: .env
        required: false
    environment:
      RBF_MODEL_PATH: ${RBF_MODEL_PATH:-rbf_dummy_model.pth}
      RAIL_LENGTH_CM: ${RAIL_LENGTH_CM:-100}
      RAIL_SEGMENT_COUNT: ${RAIL_SEGMENT_COUNT:-20}
      DEVICE_ID: ${DEVICE_ID:-rail-sensor}
      DEMO_MODE: ${DEMO_MODE:-true}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-railtwin-backend}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-replace-with-backend-password}
      MQTT_TLS: ${MQTT_TLS:-false}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-railtwin-backend-local}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-rail/v1/nodes}
      MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS:-30}
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-65536}
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    # InfluxDB 설정이 비어 있어도 서버·WebSocket은 동작
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mosquitto-data:
